name: Build and publish static edition

on:
  workflow_dispatch:
    inputs:
      bootstrap_marketplace:
        description: Establish the first silent marketplace baseline
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"
      - name: Test exact source
        run: |
          make test
          make validate
      - name: Collect and build edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bootstrap=()
          if [[ "${{ inputs.bootstrap_marketplace }}" == "true" ]]; then
            bootstrap=(--bootstrap-marketplace)
          fi
          python3 -m radar collect "${bootstrap[@]}"
      - name: Retain the next tracked source baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: news-radar-source-snapshot-${{ github.run_id }}
          path: state/source-snapshot.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
