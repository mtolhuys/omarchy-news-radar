name: Build and publish static edition

on:
  schedule:
    # GitHub schedules are best effort and may be delayed or dropped. Four
    # off-peak opportunities bound the impact of one missed invocation.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap_marketplace:
        description: Establish a baseline plus the bounded 12-story recent marketplace backfill
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Test exact source
        run: |
          make test
          make validate
      - name: Collect and build edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bootstrap=()
          if [[ "${{ inputs.bootstrap_marketplace || false }}" == "true" ]]; then
            bootstrap=(--bootstrap-marketplace)
          fi
          python3 -m radar collect "${bootstrap[@]}"
      - name: Retain the next tracked source baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: news-radar-source-snapshot-${{ github.run_id }}
          path: state/source-snapshot.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
